<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 问答预览</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .page {
            max-width: 880px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        header p {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
        }

        .ask {
            display: flex;
            gap: 10px;
        }

        .ask input {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
        }

        .ask input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }

        .ask button {
            padding: 12px 20px;
            font-size: 15px;
            color: #fff;
            background: var(--primary);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .ask button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .status {
            min-height: 20px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }

        .section {
            margin-top: 24px;
        }

        .section h2 {
            margin: 0 0 12px;
            font-size: 15px;
            color: #374151;
        }

        .answer {
            margin: 0;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .sources {
            display: grid;
            gap: 12px;
        }

        .source {
            padding: 14px 16px;
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .source-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 22px;
            padding: 0 7px;
            font-size: 12px;
            font-weight: 600;
            color: #1d4ed8;
            background: #dbeafe;
            border-radius: 6px;
        }

        .source-name {
            font-weight: 600;
            color: #111827;
        }

        .score {
            margin-left: auto;
            font-variant-numeric: tabular-nums;
        }

        .preview {
            margin: 0;
            font-size: 14px;
            color: #4b5563;
        }

        .empty {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
        }

        @media (max-width: 560px) {
            .ask { flex-direction: column; }
            .ask button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="page">
    <header>
        <h1>RAG 问答预览</h1>
        <p>调用 /ask_rag_sources，展示回答与命中的文档片段。</p>
    </header>

    <form class="card ask" id="ask-form">
        <input id="question" type="text" placeholder="例如：切块大小是多少？" autocomplete="off">
        <button id="submit" type="submit">提问</button>
    </form>

    <div class="status" id="status">输入问题后点击“提问”。</div>

    <section class="section" id="answer-section" hidden>
        <h2>回答</h2>
        <div class="card">
            <p class="answer" id="answer"></p>
        </div>
    </section>

    <section class="section" id="sources-section" hidden>
        <h2 id="sources-title">命中片段</h2>
        <div class="sources" id="sources"></div>
    </section>
</div>

<script>
    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');
    const button = document.getElementById('submit');
    const status = document.getElementById('status');
    const answerSection = document.getElementById('answer-section');
    const answerEl = document.getElementById('answer');
    const sourcesSection = document.getElementById('sources-section');
    const sourcesTitle = document.getElementById('sources-title');
    const sourcesEl = document.getElementById('sources');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const question = input.value.trim();
        if (!question) {
            status.textContent = '请先输入问题。';
            return;
        }

        button.disabled = true;
        status.textContent = '检索中，请稍候…';
        answerSection.hidden = true;
        sourcesSection.hidden = true;

        try {
            // 浏览器会用 UTF-8 对中文编码，避免命令行 curl 的编码问题
            const url = '/ask_rag_sources?question=' + encodeURIComponent(question);
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            render(await response.json());
            status.textContent = '完成。';
        } catch (error) {
            status.textContent = '请求失败：' + error.message;
        } finally {
            button.disabled = false;
        }
    });

    function render(data) {
        answerEl.textContent = data.answer || '（无回答）';
        answerSection.hidden = false;

        sourcesEl.replaceChildren();
        const sources = data.sources || [];
        sourcesTitle.textContent = '命中片段（' + sources.length + '）';

        if (sources.length === 0) {
            const empty = document.createElement('p');
            empty.className = 'empty';
            empty.textContent = '没有检索到相关片段。';
            sourcesEl.appendChild(empty);
            sourcesSection.hidden = false;
            return;
        }

        for (const item of sources) {
            sourcesEl.appendChild(createSourceCard(item));
        }
        sourcesSection.hidden = false;
    }

    function createSourceCard(item) {
        const card = document.createElement('article');
        card.className = 'source';

        const head = document.createElement('div');
        head.className = 'source-head';

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '[' + item.index + ']';
        head.appendChild(badge);

        const name = document.createElement('span');
        name.className = 'source-name';
        name.textContent = item.source || '未知来源';
        head.appendChild(name);

        if (item.title) {
            const title = document.createElement('span');
            title.textContent = '· ' + item.title;
            head.appendChild(title);
        }

        if (item.chunkIndex !== null && item.chunkIndex !== undefined) {
            const chunk = document.createElement('span');
            chunk.textContent = '· 第 ' + item.chunkIndex + ' 块';
            head.appendChild(chunk);
        }

        if (typeof item.score === 'number') {
            const score = document.createElement('span');
            score.className = 'score';
            score.textContent = item.score.toFixed(3);
            head.appendChild(score);
        }

        const preview = document.createElement('p');
        preview.className = 'preview';
        preview.textContent = item.preview || '';

        card.appendChild(head);
        card.appendChild(preview);
        return card;
    }

    input.focus();
</script>
</body>
</html>
