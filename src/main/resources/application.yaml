spring:
  application:
    name: ai-project
  ai:
    openai:
      api-key: ${ALI-API-KEY}
      base-url: https://maas.qianwenaiapi.com/compatible-mode/v1
      chat:
        model: qwen3.8-flash
      embedding:
        model: qwen3.7-text-embedding-flash
    model:
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    mcp:
      client:
        # 启动时不初始化；首次访问 /mcp 接口时才拉起 npx
        initialized: false
        # 普通 MCP 请求超时（不影响初始化超时）
        request-timeout: 60s
        stdio:
          connections:
            filesystem:
              command: cmd
              args:
                - "/c"
                - "npx"
                - "-y"
                - "@modelcontextprotocol/server-filesystem@2.1.0"
                - "D:/AI-project/ai-project/upload"
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org.springframework.ai: debug