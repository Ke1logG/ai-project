spring:
  application:
    name: ai-project
  ai:
    openai:
      api-key: ${ALI-API-KEY}
      base-url: https://maas.qianwenaiapi.com/compatible-mode/v1
      chat:
        model: qwen3.8-flash
      embedding:
        model: qwen3.7-text-embedding-flash
    model:
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org.springframework.ai: debug